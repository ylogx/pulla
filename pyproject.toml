[project]
name = "Pulla"
version = "0.4.0"
description = "Pulla helps you pull content from all repos in any folder"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Shubham Chaudhary", email = "shubham@chaudhary.xyz" },
]
requires-python = ">=3.9"
dependencies = [
    "rich==15.0.0",
    "typer==0.23.2",
]

[project.urls]
Homepage = "https://github.com/ylogx/pulla"

[project.scripts]
pulla = "pulla.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulla"]

[dependency-groups]
dev = [
    "pytest",
    "coverage",
]
